name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, unit and PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore AmazonRepricer.sln

      - name: Build
        run: dotnet build AmazonRepricer.sln --configuration Release --no-restore

      - name: Run unit tests
        run: >-
          dotnet test tests/AmazonRepricer.Tests/AmazonRepricer.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory TestResults/unit

      - name: Run PostgreSQL integration tests
        run: >-
          dotnet test tests/AmazonRepricer.IntegrationTests/AmazonRepricer.IntegrationTests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=integration-tests.trx"
          --results-directory TestResults/integration

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/repo"
          zricethezav/gitleaks:latest
          detect
          --source=/repo
          --redact
          --verbose

  backup-restore:
    name: PostgreSQL backup and restore verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      POSTGRES_DB: amazon_repricer_ci
      POSTGRES_USER: repricer_ci
      POSTGRES_PASSWORD: ci-local-password
      POSTGRES_PORT: "55432"
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=55432;Database=amazon_repricer_ci;Username=repricer_ci;Password=ci-local-password
      Jwt__Issuer: amazon-repricer-ci
      Jwt__Audience: amazon-repricer-ci
      Jwt__SigningKey: ci-only-signing-key-012345678901234567890123456789
      Jwt__AccessTokenLifetimeMinutes: "15"
      Jwt__RefreshTokenLifetimeDays: "30"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore AmazonRepricer.sln

      - name: Install EF Core CLI
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.12
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Start PostgreSQL
        run: docker compose up -d postgres

      - name: Wait for PostgreSQL
        shell: bash
        run: |
          for attempt in {1..30}; do
            if docker compose exec -T postgres \
              pg_isready \
              -U "$POSTGRES_USER" \
              -d "$POSTGRES_DB"
            then
              exit 0
            fi

            sleep 1
          done

          docker compose logs postgres
          exit 1

      - name: Apply application migrations
        run: >-
          dotnet ef database update
          --context RepricerDbContext
          --project src/AmazonRepricer.Infrastructure
          --startup-project src/AmazonRepricer.Api

      - name: Apply authentication migrations
        run: >-
          dotnet ef database update
          --context AuthDbContext
          --project src/AmazonRepricer.Infrastructure
          --startup-project src/AmazonRepricer.Api

      - name: Verify backup and restore
        run: ./scripts/postgres/backup-and-verify.sh

      - name: Clean up PostgreSQL
        if: always()
        run: docker compose down -v
